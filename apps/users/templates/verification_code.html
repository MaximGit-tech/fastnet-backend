<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:40px 0;">
        <table width="420" cellpadding="0" cellspacing="0" border="0"
               style="background:#ffffff;border-radius:12px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.05);">
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <h1 style="margin:0;font-size:22px;color:#111;">FastNet</h1>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:10px;">
              <h2 style="margin:0;font-size:18px;color:#333;">
                Код подтверждения
              </h2>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <p style="margin:0;color:#666;font-size:14px;">
                Используйте этот код для завершения входа:
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:25px;">
              <div style="
                display:inline-block;
                padding:14px 28px;
                font-size:26px;
                letter-spacing:6px;
                font-weight:bold;
                color:#111;
                background:#f1f3f5;
                border-radius:8px;
              ">
                {{ code }}
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <p style="margin:0;color:#999;font-size:13px;">
                Код действителен в течение 10 минут
              </p>
            </td>
          </tr>
          <tr>
            <td align="center">
              <p style="margin:0;color:#bbb;font-size:12px;">
                Если вы не запрашивали этот код — просто проигнорируйте письмо
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
